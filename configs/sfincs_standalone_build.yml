# HydroMT-SFINCS Direct Rainfall-on-Grid (Standalone) Build Configuration
# Designed for Full-Catchment DAS Modeling in Sumatera Barat
#
# Physics:
#   - 2D Computational Mesh: 40m regular grid in EPSG:32747 (UTM 47S)
#   - Subgrid Bathymetry: 10m FABDEM (4x4 sub-pixels per cell, multiple of 2)
#   - Roughness: Spatially distributed Manning's n from RBI Land Cover
#   - Infiltration: Spatially varying Saturated Hydraulic Conductivity (Ksat) [mm/hr]

setup_grid_from_region:
  res: 40
  rotated: false

setup_dep:
  datasets_dep:
    - elevtn: fabdem_sumbar

setup_mask_active:
  zmin: -5

setup_mask_bounds:
  btype: waterlevel
  zmax: 0

# --- High-Resolution Subgrid Topobathy & Friction ---
setup_subgrid:
  datasets_dep:
    - elevtn: fabdem_sumbar
  datasets_rgh:
    - lulc: rbi_landcover_sumbar
      reclass_table: lookup_tables/manning_lookup.csv
  nr_subgrid_pixels: 4      # 4 x 10m = 40m subgrid resolution (valid multiple of 2)
  write_dep_tif: true
  write_man_tif: true

# --- River Hydrography & Synthetic Channel Inflows ---
setup_river_inflow:
  rivers: rbi_river_sumbar
  river_upa: 5.0            # km2 threshold for upstream accumulation
  river_width: 50.0         # Default bankfull channel width (m)
  keep_rivers_geom: true

# --- Infiltration / Hydrologic Loss Scheme ---
setup_constant_infiltration:
  qinf: soil_infiltration_sumbar
  reproj_method: average
