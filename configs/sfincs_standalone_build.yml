# HydroMT-SFINCS Direct Rainfall-on-Grid (Standalone) Build Configuration
# Designed for Full-Catchment DAS Modeling in Indonesia (Sumatera Barat Baseline)
#
# Physics & Numerics:
#   - 2D Computational Mesh: 40m regular grid (or 60m–80m for fast national Kabupaten runs)
#   - Subgrid Hypsometry: 10m subgrid tables derived from FABDEM (nr_subgrid_pixels: 4 => 40m/4 = 10m)
#   - Active Mask: Strictly bounded to the hydrological watershed polygon (mask: das_region) so
#     open ocean and adjacent catchments are inactive (msk=0) and inland outlets receive msk=3
#   - Roughness: Spatially distributed Manning's n from BIG RBI Land Cover (Chow 1959 / Arcement & Schneider 1989)
#   - River Channels: Mapped centerlines burned into subgrid bathymetry (datasets_riv)
#   - Infiltration: Pre-saturated AMC-III constant-loss raster (qinf mm/hr) from Kementan soil x RBI land cover
#   - Boundaries: Waterlevel (msk=2) at coastal sea level (z <= 0) and Outflow (msk=3) at inland watershed outlets

setup_grid_from_region:
  res: 40
  rotated: false

setup_dep:
  datasets_dep:
    - elevtn: fabdem_sumbar

setup_mask_active:
  mask: das_region
  zmin: -5
  reset_mask: true

setup_mask_bounds:
  btype: waterlevel
  zmax: 0

# --- High-Resolution Subgrid Topobathy, Roughness & River Channel Burning ---
setup_subgrid:
  datasets_dep:
    - elevtn: fabdem_sumbar
  datasets_rgh:
    - lulc: rbi_landcover_sumbar
      reclass_table: lookup_tables/manning_lookup.csv
  datasets_riv:
    - centerlines: rbi_river_sumbar
      rivwth: 15.0           # Fallback width (m) for aggraded Indonesian alluvial channels (v2.0 standard)
      rivdph: 0.55           # Fallback bankfull depth (m) for silted Indonesian rivers (prevents trench trapping)
      manning: 0.045         # Vegetated/aggraded river banks (Chow 1959 / Arcement & Schneider 1989)
  nr_subgrid_pixels: 4       # 40m computational cell / 4 = 10m subgrid resolution (valid multiple of 2)
  write_dep_tif: true
  write_man_tif: false

# --- Infiltration / Hydrologic Loss Scheme ---
# Pre-calibrated AMC-III constant-loss raster (qinf [mm/hr]); do NOT apply additional amc_scale < 1.0!
setup_constant_infiltration:
  qinf: soil_infiltration_sumbar
  reproj_method: average
