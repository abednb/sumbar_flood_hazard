# HydroMT-SFINCS Direct Rainfall-on-Grid (Standalone) Build Configuration
# Designed for Full-Catchment DAS Modeling in Sumatera Barat
#
# Physics & Numerics:
#   - 2D Computational Mesh: 40m regular grid in EPSG:32747 (UTM 47S)
#   - Subgrid Hypsometry: 10m subgrid tables derived from FABDEM (30m native, bilinearly resampled to 10m)
#     nr_subgrid_pixels: 4 means 40m cell / 4 = 10m subgrid pixels
#   - Roughness: Spatially distributed Manning's n from BIG RBI Land Cover (integer-coded, Chow 1959 / Arcement & Schneider 1989)
#   - River Channels: Mapped centerlines burned into subgrid bathymetry (datasets_riv) with hydraulic-geometry power law
#   - Infiltration: Conservative constant-loss assumption (qinf mm/hr) from Kementan soil texture x RBI land cover matrix
#   - Boundaries: Waterlevel (msk=2) at coastal sea level (z <= 0) and Outflow (msk=3) at inland watershed outlets

setup_grid_from_region:
  res: 40
  rotated: false

setup_dep:
  datasets_dep:
    - elevtn: fabdem_sumbar

setup_mask_active:
  zmin: -5

setup_mask_bounds:
  btype: waterlevel
  zmax: 0

# --- High-Resolution Subgrid Topobathy, Roughness & River Channel Burning ---
setup_subgrid:
  datasets_dep:
    - elevtn: fabdem_sumbar
  datasets_rgh:
    - lulc: rbi_landcover_sumbar
      reclass_table: lookup_tables/manning_lookup.csv
  datasets_riv:
    - centerlines: rbi_river_sumbar
      rivwth: 25.0           # Leopold & Maddock (1953) / BWS Sumatera V middle-reach channel width (m)
      rivdph: 1.6            # BWS Sumatera V (2020, 2022) / Suripin (2004) aggraded bankfull depth before overtopping (m)
      manning: 0.035         # SNI 2830:2008 / KP-03 natural meandering gravel/sand channel with debris
  nr_subgrid_pixels: 4      # 40m computational cell / 4 = 10m subgrid resolution (valid multiple of 2)
  write_dep_tif: true
  write_man_tif: false

# Note on setup_river_inflow:
# In pure direct rainfall-on-grid simulations across complete watersheds, rain falls uniformly
# on all cells and routes naturally through overland flow and stream networks. Synthetic inflow
# source points without discharge hydrographs are omitted here. When external upstream hydrographs
# are supplied (e.g., from BWS stream gauges), setup_river_inflow is dynamically activated.

# --- Infiltration / Hydrologic Loss Scheme ---
# Default: Conservative constant-loss assumption (qinf [mm/hr])
setup_constant_infiltration:
  qinf: soil_infiltration_sumbar
  reproj_method: average
